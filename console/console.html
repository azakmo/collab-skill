<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Console</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e2e5eb;--accent:#2f6fec;--ok:#1a8f5a;--warn:#b7791f;--bad:#c53030;--chip:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2028;--fg:#e6e9ef;--muted:#9aa3b5;--line:#2c323d;--accent:#6b9bff;--ok:#3fbf86;--warn:#e0a84a;--bad:#f07171;--chip:#252c3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.layer{margin:18px 0}
.layer h2{font-size:15px;margin:0 0 2px}
.layer p{color:var(--muted);margin:0 0 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.off{opacity:.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--muted);font-size:12px;min-width:56px}
input[type=text],select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;min-width:0}
input[type=text]{flex:1}
textarea{width:100%;min-height:44px;resize:vertical}
button{background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.models{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:6px}
.models label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);min-width:0}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.cc{border-left:4px solid var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
#msg{min-width:200px}
details{margin-top:18px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
#lang-btn{margin-left:auto;font-size:13px;padding:3px 10px}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<main>
  <div style="display:flex;align-items:center;gap:12px;margin:0 0 4px">
    <h1 style="margin:0" data-i18n="consoleTitle"></h1>
    <a href="/ledger" style="color:var(--accent);text-decoration:none;font-size:13px" data-i18n="ledgerLink"></a>
    <button id="lang-btn" onclick="toggleLang()"></button>
  </div>
  <p class="sub" data-i18n-html="consoleSub"></p>

  <div class="card cc">
    <b data-i18n="layer1"></b> <span class="tag" data-i18n="fixed"></span>
    <div class="sub" id="ccnote" style="margin:4px 0 0"></div>
  </div>

  <section class="layer"><h2 data-i18n="layer2"></h2><p id="impl-desc"></p><div class="grid" id="impl"></div></section>
  <section class="layer"><h2 data-i18n="layer3"></h2><p id="labor-desc"></p><div class="grid" id="labor"></div></section>

  <details>
    <summary data-i18n="providersSummary"></summary>
    <p class="sub" data-i18n="providersNote"></p>
    <table id="providers"></table>
    <div class="card" style="margin-top:10px">
      <b data-i18n="addProvider"></b> <span data-i18n="addProviderHint"></span>
      <div class="row"><label data-i18n="lblId"></label><input type="text" id="np-id" data-i18n-ph="phProviderId"></div>
      <div class="row"><label data-i18n="lblName"></label><input type="text" id="np-name" data-i18n-ph="phDisplayName"></div>
      <div class="row"><label data-i18n="lblUrl"></label><input type="text" id="np-url" placeholder="https://api.example.com/v1"></div>
      <div class="row"><label data-i18n="lblKeyVar"></label><input type="text" id="np-env" data-i18n-ph="phEnv"></div>
      <div class="row"><label data-i18n="lblWire"></label><select id="np-wire"><option value="responses" data-i18n="wireResponses"></option><option value="chat" data-i18n="wireChat"></option></select></div>
      <div class="row"><button onclick="addProvider()" data-i18n="add"></button></div>
    </div>
  </details>

  <details>
    <summary data-i18n="addExecutor"></summary>
    <div class="card" style="margin-top:10px">
      <div class="row"><label data-i18n="lblId"></label><input type="text" id="ne-id" data-i18n-ph="phExecutorId"></div>
      <div class="row"><label data-i18n="lblName"></label><input type="text" id="ne-name"></div>
      <div class="row"><label data-i18n="lblProvider"></label><select id="ne-provider"></select></div>
      <div class="row"><label data-i18n="lblLayer"></label><select id="ne-layer"><option value="labor" data-i18n="layer3Short"></option><option value="impl" data-i18n="layer2Short"></option></select></div>
      <div class="row"><button onclick="addExecutor()" data-i18n="add"></button><span data-i18n="addExecutorHint"></span></div>
    </div>
  </details>
</main>

<div class="bar"><span id="msg"></span><button onclick="load()" data-i18n="discard"></button><button class="primary" onclick="save()" data-i18n="save"></button></div>

<script>
let R = null, ENV = {}, PROBED = {};
const H = {'X-Collab':'1','Content-Type':'application/json', ...LANG_HEADER};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(text, cls){ $('msg').innerHTML = `<span class="${cls||''}">${esc(text)}</span>`; }

document.title = t('consoleTitle');
applyI18n();

async function load(){
  const r = await fetch('/api/roster',{headers:H}).then(r=>r.json());
  R = r.roster; ENV = r.env || {}; render(); msg(t('loaded'));
}

function render(){
  $('ccnote').textContent = R.controller?.note || '';
  $('impl-desc').textContent = R.layers?.impl || '';
  $('labor-desc').textContent = R.layers?.labor || '';
  for (const layer of ['impl','labor']){
    const box = $(layer); box.innerHTML = '';
    R.executors.map((e,i)=>[e,i]).filter(([e])=>e.layer===layer).forEach(([e,i])=> box.appendChild(card(e,i)));
    if (!box.children.length) box.innerHTML = `<div class="sub">${esc(t('emptyLayer'))}</div>`;
  }
  $('providers').innerHTML = `<tr><th>${esc(t('thId'))}</th><th>${esc(t('thName'))}</th><th>${esc(t('thKind'))}</th><th>${esc(t('thUrl'))}</th><th>${esc(t('thKeyVar'))}</th></tr>` + R.providers.map(p =>
    `<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.kind)}${p.wire_api?' / '+esc(p.wire_api):''}</td><td>${esc(p.base_url||'—')}</td>
     <td>${p.env_key ? esc(p.env_key)+' '+(ENV[p.env_key]?`<span class="ok">${esc(t('envSet'))}</span>`:`<span class="bad">${esc(t('envUnset'))}</span>`) : '—'}</td></tr>`).join('');
  $('ne-provider').innerHTML = R.providers.map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.id)}</option>`).join('');
}

function card(e, i){
  const pv = R.providers.find(p=>p.id===e.provider) || {};
  const models = [...new Set([...(e.enabled_models||[]), ...(PROBED[e.provider]||[])])];
  const d = document.createElement('div');
  d.className = 'card' + (e.enabled ? '' : ' off');
  d.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <b>${esc(e.name||e.id)}</b>
      <label style="min-width:0"><input type="checkbox" ${e.enabled?'checked':''} onchange="R.executors[${i}].enabled=this.checked;render()"> ${esc(t('enable'))}</label>
    </div>
    <div class="row"><span class="tag">${esc(e.id)}</span><span class="tag">${esc(pv.name||e.provider)}</span></div>
    <div class="row"><label>${esc(t('lblLayer'))}</label><select onchange="R.executors[${i}].layer=this.value;render()">
      <option value="impl" ${e.layer==='impl'?'selected':''}>${esc(t('layer2Short'))}</option><option value="labor" ${e.layer==='labor'?'selected':''}>${esc(t('layer3Short'))}</option></select>
      <label>${esc(t('lblTier'))}</label><select onchange="R.executors[${i}].tier=+this.value">${[1,2,3].map(n=>`<option ${e.tier==n?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="row"><label>${esc(t('lblCost'))}</label><input type="text" value="${esc(e.cost)}" onchange="R.executors[${i}].cost=this.value"></div>
    <div class="row"><label>${esc(t('lblDefaultModel'))}</label><select onchange="R.executors[${i}].default_model=this.value">
      ${(e.enabled_models||[]).map(m=>`<option ${m===e.default_model?'selected':''}>${esc(m)}</option>`).join('') || `<option value="">${esc(t('pickModelsFirst'))}</option>`}</select>
      <button onclick="probe('${esc(e.provider)}')">${esc(t('probe'))}</button></div>
    <div class="models">${models.length ? models.map(m=>`<label><input type="checkbox" ${(e.enabled_models||[]).includes(m)?'checked':''}
      onchange="toggleModel(${i},'${esc(m)}',this.checked)"> ${esc(m)}</label>`).join('') : `<span class="sub">${esc(t('probeHint'))}</span>`}</div>
    <div class="row"><textarea placeholder="${esc(t('phNotes'))}" onchange="R.executors[${i}].notes=this.value">${esc(e.notes)}</textarea></div>`;
  return d;
}

function toggleModel(i, m, on){
  const e = R.executors[i]; const s = new Set(e.enabled_models||[]);
  on ? s.add(m) : s.delete(m); e.enabled_models = [...s];
  if (!e.enabled_models.includes(e.default_model)) e.default_model = e.enabled_models[0] || '';
  render();
}

async function probe(pid){
  const pv = R.providers.find(p=>p.id===pid); msg(t('probing', pid));
  const r = await fetch('/api/probe',{method:'POST',headers:H,body:JSON.stringify(pv)}).then(r=>r.json());
  if (r.error){ msg(t('probeFail')+r.error,'bad'); return; }
  PROBED[pid] = r.models; render(); msg(t('probeOk', pid, r.models.length),'ok');
}

function addProvider(){
  const p = {id:$('np-id').value.trim(), name:$('np-name').value.trim(), kind:'openai-compatible',
             base_url:$('np-url').value.trim(), env_key:$('np-env').value.trim(), wire_api:$('np-wire').value, probe:'models-endpoint'};
  if (!/^[a-z][a-z0-9_-]*$/.test(p.id)) return msg(t('idInvalid'),'bad');
  if (R.providers.some(x=>x.id===p.id)) return msg(t('idExists'),'bad');
  if (!/^https?:\/\//.test(p.base_url)) return msg(t('urlInvalid'),'bad');
  if (p.env_key && !/^[A-Za-z_][A-Za-z0-9_]*$/.test(p.env_key)) return msg(t('envInvalid'),'bad');
  R.providers.push(p); render(); msg(t('providerAdded', p.id),'ok');
}

function addExecutor(){
  const e = {id:$('ne-id').value.trim(), name:$('ne-name').value.trim()||$('ne-id').value.trim(), provider:$('ne-provider').value,
             layer:$('ne-layer').value, enabled:false, tier:1, cost:'', default_model:'', enabled_models:[], notes:''};
  if (!/^[a-z][a-z0-9_-]*$/.test(e.id)) return msg(t('idInvalid'),'bad');
  if (R.executors.some(x=>x.id===e.id)) return msg(t('idExists'),'bad');
  R.executors.push(e); render(); msg(t('executorAdded', e.id),'ok');
}

async function save(){
  const r = await fetch('/api/roster',{method:'POST',headers:H,body:JSON.stringify(R)}).then(r=>r.json());
  r.ok ? msg(t('saved'),'ok') : msg(t('notSaved')+r.error,'bad');
}

load().catch(e=>msg(t('loadFail')+e,'bad'));
</script>
</body>
</html>
